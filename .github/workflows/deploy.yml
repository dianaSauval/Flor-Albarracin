name: Deploy Flor Albarracin

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, flor]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy dist to web root
        run: |
          sudo mkdir -p /var/www/soyfloralbarracin.com
          sudo rsync -av --delete dist/ /var/www/soyfloralbarracin.com/
